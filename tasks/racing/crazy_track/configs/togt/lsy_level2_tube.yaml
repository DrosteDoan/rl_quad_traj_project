# lsy level-2 nominal gates with TUBE corridors for TOGT-Planner: each real gate (0.4 m opening,
# margin 0.30 -> +-0.05 m crossing window) is bracketed by an entry and an exit corridor 0.6 m
# before/after it along the gate normal (same yaw, +-0.05 m window). Effect: the time-optimal
# plan must cross every gate within ~1-7 deg of the normal instead of the 40-86 deg oblique
# crossings it otherwise exploits (measured) - a tracking error then lands along the path, not
# in the gate plane. Equivalent to TOGT's own prism (length > 0) gates, which segfault in this
# build; upstream only exercises that path once (a 16 m prism). Generated by the make_track()
# helper in scripts/togt/sweep_margin.py's companion experiments; d=0.6 was selected by sweep
# (report 2026-09-09).
initState:
  pos: [-1.5, 0.75, 1.0]
  vel: [0.0, 0.0, 0.0]
  acc: [0.0, 0.0, 0.0]
  jer: [0.0, 0.0, 0.0]
  rot: [1.0, 0.0, 0.0, 0.0]
  cthrustmass: 9.81
  euler: [0.0, 0.0, 0.0]

endState:
  pos: [1.0, -0.75, 1.2]
  vel: [0.0, 0.0, 0.0]
  acc: [0.0, 0.0, 0.0]
  jer: [0.0, 0.0, 0.0]
  rot: [1.0, 0.0, 0.0, 0.0]
  cthrustmass: 9.81
  euler: [0.0, 0.0, 0.0]

