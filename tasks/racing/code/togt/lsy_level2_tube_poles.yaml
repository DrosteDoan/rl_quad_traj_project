# lsy level-2 nominal gates with POLE-AWARE tube corridors -- Lesson 7 (and Lesson 6 exercise 3).
# Upstream's tube (crazy_track/configs/togt/lsy_level2_tube.yaml) puts a 0.6 m entry/exit corridor
# on every gate axis; three of them stand ON the track's obstacle poles (G1in on pole 1, G3out on
# pole 3, G4in on pole 4), so every upstream tube plan ends on a contact in the real race. Here those
# three corridors are replaced by SingleBall vias placed BESIDE the poles (B1 south-east of pole 1,
# B3 south of pole 3, B4 south of pole 4; radius 0.15 m); the other corridors, the gates and the
# start/end are upstream's. Found on 2026-09-11 by a search over via placements ("ball vias").
#   planned lap: 3.830 s at 0.85 x TWR (top speed 4.5 m/s), 3.527 s at 0.95 x TWR (5.0 m/s)
#   reference clearance from the pole surfaces: 0.21 / 0.33 / 0.30 / 0.20 m (upstream: 0.06 / 0.31 / 0.02 / 0.03)
#   crossing angles G1..G4: 10 / 5 / 16 / 17 deg (upstream tube: 2-7 deg; the pole-4 clearance and
#   the G4 angle trade off: a pole 0.5 m in front of a gate on its axis forbids a long straight approach)
#   real race (Level 0, one episode): plain MPC 4/4 in 5.32 s at 0.85 x TWR unstretched; the ESO
#   variant needs x1.15 (5.90 s). Plan it with:  python tasks/racing/code/togt_plan.py --track poles
